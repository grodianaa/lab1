<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Lantern Grove</title>
  <meta name="description" content="A slingshot physics game: knock the mischievous glimmer imps out of their wood, glass and stone forts.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --ink: #fff4e2;
      --ink-dim: rgba(255, 244, 226, 0.68);
      --panel: rgba(28, 20, 56, 0.55);
      --panel-edge: rgba(255, 220, 170, 0.18);
      --amber: #ffc457;
      --teal: #7fe3d4;
      --bg: #140f2a;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--bg);
      font-family: "Fredoka", system-ui, -apple-system, "Segoe UI", sans-serif;
      color: var(--ink);
      -webkit-user-select: none;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    button { font: inherit; color: inherit; }

    #game {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      touch-action: none;
    }
    #game.can-grab { cursor: grab; }
    #game.grabbing { cursor: grabbing; }
    #game.can-detonate { cursor: crosshair; }

    .vignette {
      position: fixed;
      inset: 0;
      pointer-events: none;
      background: radial-gradient(ellipse at 50% 45%, transparent 55%, rgba(8, 4, 20, 0.55) 100%);
    }

    /* ---------- HUD ---------- */
    .hud {
      position: fixed;
      top: 16px;
      left: 16px;
      right: 16px;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 10px;
      pointer-events: none;
    }
    .hud-group { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
    .hud-group.right { justify-content: flex-end; }

    .panel {
      background: var(--panel);
      border: 1px solid var(--panel-edge);
      border-radius: 14px;
      padding: 8px 14px;
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      box-shadow: 0 6px 24px rgba(0, 0, 0, 0.25), inset 0 1px 0 rgba(255, 255, 255, 0.06);
      display: flex;
      align-items: center;
      gap: 10px;
      min-height: 44px;
    }

    .brand {
      font-weight: 700;
      font-size: 20px;
      letter-spacing: 0.02em;
      background: linear-gradient(180deg, #fff1cf, #ffb35c);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    .label {
      font-size: 12px;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--ink-dim);
    }
    .level-name { font-weight: 600; font-size: 16px; }

    .score {
      font-weight: 700;
      font-size: 22px;
      font-variant-numeric: tabular-nums;
      min-width: 76px;
      text-align: right;
      transition: transform 0.15s;
    }
    .score.bump { transform: scale(1.15); }

    .imps { display: flex; gap: 6px; }
    .imp-pip {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: radial-gradient(circle at 40% 35%, #fff6d6 0%, #ffc457 45%, #e2731e 100%);
      box-shadow: 0 0 12px rgba(255, 180, 80, 0.8);
      transition: opacity 0.4s, transform 0.4s;
    }
    .imp-pip.out {
      opacity: 0.2;
      transform: scale(0.7);
      box-shadow: none;
      background: #5a4a6a;
    }

    .icon-btn {
      pointer-events: auto;
      width: 44px;
      height: 44px;
      border-radius: 14px;
      border: 1px solid var(--panel-edge);
      background: var(--panel);
      cursor: pointer;
      display: grid;
      place-items: center;
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      transition: transform 0.15s, background 0.2s;
    }
    .icon-btn:hover { background: rgba(60, 44, 110, 0.7); transform: translateY(-1px); }
    .icon-btn:active { transform: translateY(1px); }
    .icon-btn svg { width: 20px; height: 20px; }

    /* ---------- Ammo tray ---------- */
    .tray {
      position: fixed;
      left: 16px;
      bottom: 16px;
      display: flex;
      gap: 8px;
      padding: 8px;
      border-radius: 18px;
      background: var(--panel);
      border: 1px solid var(--panel-edge);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      box-shadow: 0 6px 24px rgba(0, 0, 0, 0.25);
    }
    .ammo {
      position: relative;
      width: 64px;
      height: 64px;
      border-radius: 14px;
      border: 2px solid transparent;
      background: rgba(255, 255, 255, 0.04);
      cursor: pointer;
      display: grid;
      place-items: center;
      transition: background 0.2s, border-color 0.2s, transform 0.15s, opacity 0.2s;
    }
    .ammo:hover:not(:disabled) { background: rgba(255, 255, 255, 0.1); transform: translateY(-2px); }
    .ammo.selected { border-color: rgba(255, 220, 160, 0.85); background: rgba(255, 220, 160, 0.12); }
    .ammo:disabled { opacity: 0.3; cursor: default; }
    .ammo .key {
      position: absolute;
      top: 3px;
      left: 6px;
      font-size: 10px;
      color: var(--ink-dim);
    }
    .ammo .count {
      position: absolute;
      right: -6px;
      bottom: -6px;
      min-width: 22px;
      height: 22px;
      padding: 0 6px;
      border-radius: 11px;
      background: #ffd88a;
      color: #2a1606;
      font-size: 13px;
      font-weight: 700;
      display: grid;
      place-items: center;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.35);
    }
    .ammo-icon { border-radius: 50%; position: relative; }
    .ammo-icon.normal {
      width: 28px; height: 28px;
      background: radial-gradient(circle at 35% 30%, #c7d5e4 0%, #5b6a80 50%, #232b3a 100%);
      box-shadow: 0 0 12px rgba(127, 227, 212, 0.6);
    }
    .ammo-icon.heavy {
      width: 36px; height: 36px;
      background:
        linear-gradient(90deg, transparent 44%, rgba(20, 16, 30, 0.6) 44%, rgba(20, 16, 30, 0.6) 56%, transparent 56%),
        radial-gradient(circle at 35% 30%, #b8b0c8 0%, #4a4458 55%, #1e1a28 100%);
      box-shadow: 0 0 12px rgba(180, 150, 255, 0.45);
    }
    .ammo-icon.bomb {
      width: 28px; height: 28px; margin-top: 6px;
      background: radial-gradient(circle at 35% 30%, #ffc9a0 0%, #d8452a 50%, #5a1410 100%);
      box-shadow: 0 0 14px rgba(255, 120, 60, 0.7);
    }
    .ammo-icon.bomb::after {
      content: "";
      position: absolute;
      left: 50%;
      top: -9px;
      width: 4px;
      height: 10px;
      transform: translateX(-50%) rotate(15deg);
      border-radius: 2px;
      background: #3a2a22;
      box-shadow: 1px -4px 6px 2px rgba(255, 210, 120, 0.9);
    }

    .hint {
      position: fixed;
      left: 50%;
      bottom: 28px;
      transform: translateX(-50%);
      padding: 10px 18px;
      border-radius: 999px;
      background: var(--panel);
      border: 1px solid var(--panel-edge);
      font-size: 15px;
      color: var(--ink-dim);
      pointer-events: none;
      white-space: nowrap;
      transition: opacity 0.6s, transform 0.6s;
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
    }
    .hint b { color: var(--ink); font-weight: 600; }
    .hint.hidden { opacity: 0; transform: translateX(-50%) translateY(12px); }

    /* ---------- Overlays ---------- */
    .overlay {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 16px;
      background: radial-gradient(ellipse at center, rgba(20, 12, 44, 0.35), rgba(10, 6, 24, 0.75));
      transition: opacity 0.45s;
      z-index: 5;
      overflow-y: auto;
    }
    .overlay.hidden { opacity: 0; pointer-events: none; }
    .overlay.hidden .card { transform: translateY(24px) scale(0.96); }

    .card {
      width: min(440px, 100%);
      text-align: center;
      padding: 30px 26px 26px;
      border-radius: 24px;
      background: linear-gradient(180deg, rgba(52, 36, 98, 0.94), rgba(30, 20, 62, 0.96));
      border: 1px solid rgba(255, 220, 170, 0.22);
      box-shadow: 0 30px 80px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.08);
      transition: transform 0.5s cubic-bezier(.2, .9, .3, 1.2);
    }
    .card.wide { width: min(760px, 100%); }

    .card h1 {
      font-size: 44px;
      font-weight: 700;
      line-height: 1.05;
      margin-bottom: 8px;
      background: linear-gradient(180deg, #fff1cf, #ffb35c);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    .card.lose h1 { background-image: linear-gradient(180deg, #e9fffb, #7fe3d4); }
    .card p { color: var(--ink-dim); font-size: 16px; }
    .card .sub { margin-bottom: 22px; }

    .stars { display: flex; justify-content: center; gap: 10px; margin: 6px 0 16px; }
    .star {
      width: 54px;
      height: 54px;
      clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);
      background: rgba(255, 255, 255, 0.12);
    }
    .star:nth-child(2) { width: 66px; height: 66px; margin-top: -10px; }
    .star.on {
      background: linear-gradient(180deg, #fff2b8, #ffbf3c 60%, #f08a1c);
      animation: starPop 0.55s cubic-bezier(.3, 1.6, .5, 1) both;
    }
    @keyframes starPop {
      0% { transform: scale(0) rotate(-40deg); opacity: 0; }
      100% { transform: scale(1) rotate(0); opacity: 1; }
    }

    .final-score {
      font-size: 34px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      margin-bottom: 2px;
    }
    .bonus { font-size: 14px; color: var(--amber); min-height: 20px; margin-bottom: 20px; }

    .btn-row { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
    .btn {
      font-size: 17px;
      font-weight: 600;
      color: #2a1606;
      padding: 12px 26px;
      border: none;
      border-radius: 999px;
      cursor: pointer;
      background: linear-gradient(180deg, #ffd88a, #ff9a4c);
      box-shadow: 0 8px 24px rgba(255, 140, 60, 0.4), inset 0 -3px 0 rgba(0, 0, 0, 0.15);
      transition: transform 0.15s, box-shadow 0.15s;
    }
    .btn:hover { transform: translateY(-2px); }
    .btn:active { transform: translateY(1px); }
    .btn.ghost {
      background: rgba(255, 255, 255, 0.08);
      color: var(--ink);
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.18);
    }
    .card.lose .btn:not(.ghost) {
      background: linear-gradient(180deg, #bff6ee, #5fcbbb);
      color: #08302b;
      box-shadow: 0 8px 24px rgba(95, 203, 187, 0.35), inset 0 -3px 0 rgba(0, 0, 0, 0.15);
    }
    .hidden-el { display: none !important; }

    /* Level select */
    .menu-title {
      font-size: 52px;
      font-weight: 700;
      line-height: 1;
      background: linear-gradient(180deg, #fff1cf, #ffb35c);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      margin-bottom: 8px;
    }
    .levels {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      margin: 24px 0 8px;
    }
    .level-card {
      position: relative;
      padding: 16px 10px 14px;
      border-radius: 18px;
      border: 1px solid rgba(255, 220, 170, 0.2);
      background: rgba(255, 255, 255, 0.05);
      cursor: pointer;
      text-align: center;
      transition: transform 0.2s, background 0.2s, border-color 0.2s;
    }
    .level-card:hover:not(:disabled) { transform: translateY(-3px); background: rgba(255, 220, 160, 0.1); border-color: rgba(255, 220, 160, 0.5); }
    .level-card:disabled { opacity: 0.4; cursor: default; }
    .level-card .num { font-size: 34px; font-weight: 700; line-height: 1.1; }
    .level-card .nm { font-size: 14px; color: var(--ink-dim); margin-bottom: 8px; min-height: 18px; }
    .level-card .mini-stars { display: flex; justify-content: center; gap: 3px; margin-bottom: 6px; }
    .level-card .mini-stars span {
      width: 18px; height: 18px;
      clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);
      background: rgba(255, 255, 255, 0.15);
    }
    .level-card .mini-stars span.on { background: linear-gradient(180deg, #fff2b8, #ffbf3c); }
    .level-card .best { font-size: 12px; color: var(--ink-dim); font-variant-numeric: tabular-nums; }
    .level-card .diff { font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--amber); }
    .legend { display: flex; gap: 18px; justify-content: center; flex-wrap: wrap; margin-top: 16px; font-size: 13px; color: var(--ink-dim); }
    .legend span { display: inline-flex; align-items: center; gap: 6px; }
    .legend .ammo-icon { transform: scale(0.6); margin: -6px; }

    .error {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      text-align: center;
      padding: 16px;
      font-size: 18px;
    }

    @media (max-width: 760px) {
      .brand-panel { display: none; }
      .levels { grid-template-columns: repeat(2, 1fr); }
      .menu-title { font-size: 40px; }
    }
    @media (max-width: 560px) {
      .panel { padding: 6px 10px; gap: 8px; min-height: 40px; }
      .label { display: none; }
      .level-name { font-size: 14px; }
      .score { font-size: 18px; min-width: 56px; }
      .icon-btn { width: 40px; height: 40px; }
      .ammo { width: 52px; height: 52px; }
      .hint { font-size: 12px; bottom: 96px; }
      .card h1 { font-size: 36px; }
    }
  </style>
</head>
<body>
  <canvas id="game" aria-label="Slingshot game canvas"></canvas>
  <div class="vignette"></div>

  <div class="hud">
    <div class="hud-group">
      <div class="panel brand-panel"><span class="brand">Lantern Grove</span></div>
      <div class="panel"><span class="label" id="levelNum">Level 1</span><span class="level-name" id="levelName"></span></div>
      <div class="panel">
        <span class="label">Imps</span>
        <div class="imps" id="impPips"></div>
      </div>
    </div>
    <div class="hud-group right">
      <div class="panel"><span class="label">Score</span><span class="score" id="score">0</span></div>
      <button class="icon-btn" id="muteBtn" title="Toggle sound" aria-label="Toggle sound"></button>
      <button class="icon-btn" id="levelsBtn" title="Levels" aria-label="Level select">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
      </button>
      <button class="icon-btn" id="restartBtn" title="Restart level (R)" aria-label="Restart level">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg>
      </button>
    </div>
  </div>

  <div class="tray hidden-el" id="tray">
    <button class="ammo" data-type="normal" title="Stone (1)"><span class="key">1</span><span class="ammo-icon normal"></span><span class="count">0</span></button>
    <button class="ammo" data-type="heavy" title="Boulder (2): heavy, smashes through blocks"><span class="key">2</span><span class="ammo-icon heavy"></span><span class="count">0</span></button>
    <button class="ammo" data-type="bomb" title="Ember bomb (3): explodes on impact or tap"><span class="key">3</span><span class="ammo-icon bomb"></span><span class="count">0</span></button>
  </div>

  <div class="hint hidden" id="hint"></div>

  <!-- Level select -->
  <div class="overlay" id="menu">
    <div class="card wide">
      <div class="menu-title">Lantern Grove</div>
      <p>Glimmer imps have nested in the grove. Sling them out of their forts!</p>
      <div class="levels" id="levelGrid"></div>
      <div class="legend">
        <span><span class="ammo-icon normal"></span> Stone: all-rounder</span>
        <span><span class="ammo-icon heavy"></span> Boulder: smashes stone</span>
        <span><span class="ammo-icon bomb"></span> Ember bomb: tap to detonate</span>
      </div>
    </div>
  </div>

  <!-- Result -->
  <div class="overlay hidden" id="result">
    <div class="card" id="resultCard">
      <h1 id="resultTitle">You win</h1>
      <div class="stars" id="resultStars"><span class="star"></span><span class="star"></span><span class="star"></span></div>
      <div class="final-score" id="resultScore">0</div>
      <div class="bonus" id="resultBonus"></div>
      <p class="sub" id="resultText"></p>
      <div class="btn-row">
        <button class="btn ghost" id="btnLevels">Levels</button>
        <button class="btn ghost" id="btnReplay">Replay</button>
        <button class="btn" id="btnNext">Next level</button>
      </div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
  <script>
  (() => {
    'use strict';

    if (typeof Matter === 'undefined') {
      document.body.insertAdjacentHTML('beforeend',
        '<div class="error">Could not load the physics engine.<br>Check your connection and reload.</div>');
      return;
    }

    const { Engine, Bodies, Body, Composite, Events, Vector } = Matter;

    // ---------------------------------------------------------------
    // Constants
    // ---------------------------------------------------------------
    const W = 1600, H = 900;
    const GROUND = 820;
    const STEP = 1000 / 60;
    const GRAV_STEP = 0.001 * STEP * STEP;

    const SLING = { x: 250, anchor: { x: 256, y: 652 }, back: { x: 230, y: 640 }, front: { x: 284, y: 644 } };
    const MAX_PULL = 170;
    const AMMO_BONUS = 4000;
    const ENEMY_SCORE = 5000;

    const AMMO = {
      normal: { r: 22, density: 0.004, power: 0.15, restitution: 0.25, trail: [127, 227, 212] },
      heavy:  { r: 28, density: 0.011, power: 0.13, restitution: 0.08, trail: [190, 160, 255] },
      bomb:   { r: 22, density: 0.003, power: 0.15, restitution: 0.2,  trail: [255, 150, 70] }
    };
    const AMMO_ORDER = ['normal', 'heavy', 'bomb'];

    const MATS = {
      wood:  { density: 0.0016, friction: 0.9,  frictionStatic: 1.1, restitution: 0.03, hp: 100, score: 400 },
      glass: { density: 0.0012, friction: 0.5,  frictionStatic: 0.9, restitution: 0.08, hp: 32,  score: 250 },
      stone: { density: 0.004,  friction: 1.0,  frictionStatic: 1.4, restitution: 0.01, hp: 300, score: 700 }
    };

    const ENEMIES = {
      imp:    { r: 24, density: 0.001,  hp: 100, core: ['#fffaf0', '#ffd77a', '#f59a3a', '#c2561a'], glow: [255, 190, 90],  ink: '#5a2208' },
      sprout: { r: 20, density: 0.001,  hp: 60,  core: ['#fff4fa', '#ffb3d6', '#ff6fa8', '#b8326c'], glow: [255, 130, 190], ink: '#5a1030' },
      chief:  { r: 34, density: 0.0015, hp: 260, core: ['#f0fff6', '#9cf0c4', '#3fbf87', '#1f7a52'], glow: [110, 230, 170], ink: '#0e3a26' }
    };

    // ---------------------------------------------------------------
    // Levels
    // ---------------------------------------------------------------
    const LEVELS = [
      {
        name: 'First Light', diff: 'Easy',
        ammo: { normal: 4, heavy: 2, bomb: 0 },
        build({ post, beam, box, imp }) {
          // A small, open glass shelter: one imp exposed on top, one easy to reach below
          const G = GROUND;
          post(1060, G, 100, 'glass'); post(1180, G, 100, 'glass');
          beam(1120, G - 100, 160, 'wood');
          imp(1120, G, 'sprout');
          imp(1120, G - 120, 'sprout');
          box(1260, G, 44, 'glass');
        }
      },
      {
        name: 'Glasshouse', diff: 'Medium',
        ammo: { normal: 2, heavy: 1, bomb: 1 },
        build({ post, beam, box, imp }) {
          const G = GROUND;
          post(1010, G, 100, 'wood'); post(1090, G, 100, 'wood');
          box(1050, G, 40, 'glass');
          beam(1050, G - 100, 120, 'glass');
          imp(1050, G - 120, 'imp');

          post(1190, G, 130, 'glass'); post(1310, G, 130, 'glass'); post(1430, G, 130, 'glass');
          beam(1310, G - 130, 270, 'wood');
          imp(1250, G, 'imp');
          box(1370, G, 50, 'glass');
          box(1240, G - 150, 46, 'wood'); box(1380, G - 150, 46, 'wood');
          beam(1310, G - 196, 200, 'glass');
          imp(1310, G - 150, 'sprout');
          box(1310, G - 216, 36, 'glass');
        }
      },
      {
        name: 'Stone Keep', diff: 'Hard',
        ammo: { normal: 2, heavy: 1, bomb: 1 },
        build({ post, beam, box, imp }) {
          const G = GROUND;
          box(990, G, 44, 'stone'); box(990, G - 44, 44, 'stone');

          post(1110, G, 140, 'stone', 26); post(1270, G, 140, 'stone', 26);
          beam(1190, G - 140, 200, 'wood', 22);
          imp(1190, G, 'chief');
          post(1135, G - 162, 90, 'stone'); post(1245, G - 162, 90, 'stone');
          beam(1190, G - 252, 150, 'stone');
          imp(1190, G - 162, 'imp');
          box(1190, G - 272, 40, 'glass');

          post(1350, G, 110, 'wood'); post(1470, G, 110, 'wood');
          beam(1410, G - 110, 150, 'glass');
          imp(1410, G, 'sprout');
          box(1410, G - 130, 40, 'wood');
        }
      },
      {
        name: 'Moonspire', diff: 'Expert',
        ammo: { normal: 1, heavy: 1, bomb: 2 },
        build({ post, beam, box, imp }) {
          const G = GROUND;
          box(980, G, 44, 'stone'); box(980, G - 44, 44, 'stone'); box(980, G - 88, 44, 'stone');

          [1100, 1220, 1340, 1460].forEach(x => post(x, G, 120, 'stone', 24));
          beam(1280, G - 120, 390, 'stone', 22);
          imp(1160, G, 'imp');
          box(1280, G, 50, 'glass');
          imp(1400, G, 'chief');

          [1140, 1280, 1420].forEach(x => post(x, G - 142, 120, 'wood'));
          beam(1280, G - 262, 310, 'wood');
          imp(1210, G - 142, 'sprout');
          box(1350, G - 142, 44, 'glass');

          post(1220, G - 282, 90, 'glass'); post(1340, G - 282, 90, 'glass');
          beam(1280, G - 372, 150, 'glass');
          imp(1280, G - 282, 'imp');
          box(1280, G - 392, 40, 'stone');
        }
      }
    ];

    // ---------------------------------------------------------------
    // Progress (per-browser convenience only)
    // ---------------------------------------------------------------
    let progress = { best: [], stars: [] };
    try {
      const saved = JSON.parse(localStorage.getItem('lg-progress') || 'null');
      if (saved && Array.isArray(saved.best) && Array.isArray(saved.stars)) progress = saved;
    } catch (e) {}
    function saveProgress() {
      try { localStorage.setItem('lg-progress', JSON.stringify(progress)); } catch (e) {}
    }
    const isUnlocked = i => i === 0 || (progress.stars[i - 1] || 0) > 0;

    // ---------------------------------------------------------------
    // Canvas & view
    // ---------------------------------------------------------------
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    const bg = document.createElement('canvas');
    const bgx = bg.getContext('2d');
    let cw = 0, ch = 0, dpr = 1, scale = 1, ox = 0, oy = 0;

    function resize() {
      dpr = Math.min(window.devicePixelRatio || 1, 2);
      cw = window.innerWidth;
      ch = window.innerHeight;
      canvas.width = bg.width = Math.round(cw * dpr);
      canvas.height = bg.height = Math.round(ch * dpr);
      scale = Math.min(cw / W, ch / H);
      ox = (cw - W * scale) / 2;
      oy = (ch - H * scale) / 2;
      drawBackground();
    }

    const toWorld = (px, py) => ({ x: (px - ox) / scale, y: (py - oy) / scale });

    function rng(seed) {
      return () => {
        seed = (seed * 16807) % 2147483647;
        return (seed - 1) / 2147483646;
      };
    }

    function roundRect(c, x, y, w, h, r) {
      r = Math.min(r, w / 2, h / 2);
      c.beginPath();
      c.moveTo(x + r, y);
      c.arcTo(x + w, y, x + w, y + h, r);
      c.arcTo(x + w, y + h, x, y + h, r);
      c.arcTo(x, y + h, x, y, r);
      c.arcTo(x, y, x + w, y, r);
      c.closePath();
    }

    const rgba = (c, a) => `rgba(${c[0]},${c[1]},${c[2]},${a})`;
    const fmt = n => Math.round(n).toLocaleString('en-US');

    // ---------------------------------------------------------------
    // Static scenery
    // ---------------------------------------------------------------
    function drawBackground() {
      const c = bgx;
      c.setTransform(dpr, 0, 0, dpr, 0, 0);
      const sky = c.createLinearGradient(0, 0, 0, ch);
      sky.addColorStop(0, '#120c2e');
      sky.addColorStop(0.35, '#2e1f5c');
      sky.addColorStop(0.62, '#7a3f6e');
      sky.addColorStop(0.8, '#e0806a');
      sky.addColorStop(1, '#f7c58c');
      c.fillStyle = sky;
      c.fillRect(0, 0, cw, ch);

      c.setTransform(dpr * scale, 0, 0, dpr * scale, dpr * ox, dpr * oy);
      const L = -ox / scale - 10, R = (cw - ox) / scale + 10;
      const B = (ch - oy) / scale + 10, T = -oy / scale;

      const r = rng(7);
      for (let i = 0; i < 160; i++) {
        const x = L + r() * (R - L);
        const y = T + r() * (520 - T);
        const s = r() * 1.6 + 0.3;
        c.globalAlpha = (1 - (y - T) / (560 - T)) * (0.35 + r() * 0.65);
        c.fillStyle = r() > 0.85 ? '#ffe2b8' : '#e8e4ff';
        c.beginPath();
        c.arc(x, y, s, 0, Math.PI * 2);
        c.fill();
      }
      c.globalAlpha = 1;

      const mx = 760, my = 190;
      const halo = c.createRadialGradient(mx, my, 40, mx, my, 260);
      halo.addColorStop(0, 'rgba(255, 220, 190, 0.35)');
      halo.addColorStop(1, 'rgba(255, 220, 190, 0)');
      c.fillStyle = halo;
      c.fillRect(mx - 260, my - 260, 520, 520);
      const moon = c.createRadialGradient(mx - 18, my - 18, 6, mx, my, 62);
      moon.addColorStop(0, '#fff8ea');
      moon.addColorStop(1, '#f6d9b6');
      c.fillStyle = moon;
      c.beginPath();
      c.arc(mx, my, 58, 0, Math.PI * 2);
      c.fill();
      c.fillStyle = 'rgba(214, 170, 150, 0.35)';
      [[-16, -8, 11], [14, 16, 8], [20, -20, 5], [-8, 24, 6]].forEach(([dx, dy, rr]) => {
        c.beginPath();
        c.arc(mx + dx, my + dy, rr, 0, Math.PI * 2);
        c.fill();
      });

      const ridge = (base, waves, fill, trees, seed) => {
        c.beginPath();
        c.moveTo(L, B);
        const pts = [];
        for (let x = L; x <= R + 8; x += 8) {
          let y = base;
          for (const [a, f, p] of waves) y -= Math.sin(x * f + p + seed) * a;
          pts.push([x, y]);
          c.lineTo(x, y);
        }
        c.lineTo(R, B);
        c.closePath();
        c.fillStyle = fill;
        c.fill();
        if (trees) {
          const tr = rng(seed * 1000 + 3);
          for (const [x, y] of pts) {
            if (tr() > trees.density) continue;
            const h = trees.min + tr() * (trees.max - trees.min);
            const w = h * 0.36;
            c.beginPath();
            c.moveTo(x, y - h);
            c.lineTo(x + w, y + 4);
            c.lineTo(x - w, y + 4);
            c.closePath();
            c.fill();
          }
        }
      };

      ridge(600, [[40, 0.004, 0], [18, 0.011, 2]], '#4a2f6b', null, 1);
      mist(c, L, R, 560, 680, 'rgba(255, 170, 160, 0.18)');
      ridge(690, [[30, 0.006, 1], [12, 0.017, 0]], '#35245a', { density: 0.18, min: 30, max: 60 }, 2);
      mist(c, L, R, 650, 760, 'rgba(240, 140, 150, 0.14)');
      ridge(770, [[18, 0.008, 3], [8, 0.023, 1]], '#251a45', { density: 0.12, min: 40, max: 80 }, 3);

      const soil = c.createLinearGradient(0, GROUND, 0, GROUND + 120);
      soil.addColorStop(0, '#1f2a3c');
      soil.addColorStop(1, '#100c20');
      c.fillStyle = soil;
      c.fillRect(L, GROUND, R - L, B - GROUND);

      c.fillStyle = '#2f5c55';
      c.beginPath();
      c.moveTo(L, GROUND + 14);
      const gr = rng(11);
      for (let x = L; x <= R; x += 6) {
        c.lineTo(x, GROUND - gr() * 7);
        c.lineTo(x + 3, GROUND + 2);
      }
      c.lineTo(R, GROUND + 14);
      c.closePath();
      c.fill();
      c.fillStyle = '#4f8a72';
      c.fillRect(L, GROUND, R - L, 3);

      const pr = rng(19);
      for (let i = 0; i < 60; i++) {
        const x = L + pr() * (R - L);
        const y = GROUND + 18 + pr() * 60;
        c.fillStyle = `rgba(120, 130, 170, ${0.08 + pr() * 0.12})`;
        c.beginPath();
        c.ellipse(x, y, 3 + pr() * 6, 2 + pr() * 3, 0, 0, Math.PI * 2);
        c.fill();
      }
    }

    function mist(c, L, R, y0, y1, color) {
      const g = c.createLinearGradient(0, y0, 0, y1);
      g.addColorStop(0, 'rgba(0,0,0,0)');
      g.addColorStop(0.5, color);
      g.addColorStop(1, 'rgba(0,0,0,0)');
      c.fillStyle = g;
      c.fillRect(L, y0, R - L, y1 - y0);
    }

    // ---------------------------------------------------------------
    // Physics world
    // ---------------------------------------------------------------
    const engine = Engine.create({ positionIterations: 10, velocityIterations: 8, enableSleeping: false });
    engine.gravity.y = 1;

    let blocks = [], enemies = [], ball = null;
    let breakQueue = [], explodeQueue = [];
    let particles = [];
    let armed = false;

    const groundBody = Bodies.rectangle(W / 2, GROUND + 100, 6000, 200, { isStatic: true, friction: 1, label: 'ground' });

    function addBlock(x, y, w, h, mat) {
      const m = MATS[mat];
      const b = Bodies.rectangle(x, y, w, h, {
        density: m.density, friction: m.friction, frictionStatic: m.frictionStatic,
        restitution: m.restitution, label: 'block', chamfer: { radius: 2 }
      });
      const r = Math.random;
      const hp = m.hp * Math.min(2.2, Math.max(0.6, (w * h) / 2860));
      const crack = () => {
        const pts = [];
        let px = (r() - 0.5) * w, py = r() > 0.5 ? -h / 2 : h / 2;
        if (w < h) { px = r() > 0.5 ? -w / 2 : w / 2; py = (r() - 0.5) * h; }
        pts.push([px, py]);
        for (let i = 0; i < 3; i++) {
          px = px * 0.5 + (r() - 0.5) * w * 0.5;
          py = py * 0.5 + (r() - 0.5) * h * 0.5;
          pts.push([px, py]);
        }
        return pts;
      };
      b.plugin = {
        mat, w, h, hp, maxHp: hp, dead: false,
        hue: r(),
        grain: Array.from({ length: 3 + Math.floor(Math.max(w, h) / 45) }, () => ({ o: r(), a: r(), l: 0.4 + r() * 0.5 })),
        knot: r() > 0.5 ? { u: r() * 0.6 + 0.2, v: r() * 0.4 + 0.3 } : null,
        specks: Array.from({ length: Math.floor((w * h) / 260) }, () => [(r() - 0.5) * (w - 6), (r() - 0.5) * (h - 6), r()]),
        cracks: [crack(), crack(), crack()]
      };
      blocks.push(b);
      return b;
    }

    function addEnemy(x, y, kind) {
      const k = ENEMIES[kind];
      const e = Bodies.circle(x, y, k.r, { density: k.density, friction: 0.4, restitution: 0.2, label: 'enemy' });
      e.plugin = { kind, hp: k.hp, maxHp: k.hp, flash: 0, phase: Math.random() * Math.PI * 2, dead: false, blink: Math.random() * 4, hop: 0 };
      enemies.push(e);
      return e;
    }

    function buildLevel(i) {
      Composite.clear(engine.world, false);
      blocks = [];
      enemies = [];
      ball = null;
      breakQueue = [];
      explodeQueue = [];
      particles = [];
      armed = false;
      LEVELS[i].build({
        post: (x, base, h, mat, w = 22) => addBlock(x, base - h / 2, w, h, mat),
        beam: (x, base, w, mat, h = 20) => addBlock(x, base - h / 2, w, h, mat),
        box: (x, base, s, mat) => addBlock(x, base - s / 2, s, s, mat),
        imp: (x, base, kind) => addEnemy(x, base - ENEMIES[kind].r, kind)
      });
      Composite.add(engine.world, [groundBody, ...blocks, ...enemies]);
    }

    // ---------------------------------------------------------------
    // Collisions and damage
    // ---------------------------------------------------------------
    let lastThud = 0;

    function impactEnergy(self, other, rel) {
      const m = self.mass;
      const mu = other.isStatic ? m : (m * other.mass) / (m + other.mass);
      return 0.5 * mu * rel * rel;
    }

    // Returns true when this hit breaks `self`
    function applyImpact(self, other, rel, pt) {
      if (!self.plugin || self.plugin.dead) return false;
      if (self.label === 'block') {
        const dmg = Math.max(0, impactEnergy(self, other, rel) - 30) * 0.25;
        if (dmg <= 0) return false;
        self.plugin.hp -= dmg;
        if (self.plugin.hp <= 0) {
          self.plugin.dead = true;
          breakQueue.push(self);
          return true;
        }
        if (dmg > 15) sfx.creak(self.plugin.mat);
      } else if (self.label === 'enemy') {
        const dmg = Math.max(0, impactEnergy(self, other, rel) - 3) * 2.5;
        if (dmg < 1) return false;
        self.plugin.hp -= dmg;
        self.plugin.flash = 1;
        if (self.plugin.hp <= 0) {
          self.plugin.dead = true;
          breakQueue.push(self);
          return true;
        }
        sfx.ping();
        spawnSparks(pt.x, pt.y, 6, ENEMIES[self.plugin.kind].glow);
      }
      return false;
    }

    Events.on(engine, 'collisionStart', e => {
      if (!armed) return;
      for (const p of e.pairs) {
        const a = p.bodyA.parent, b = p.bodyB.parent;
        const rel = Vector.magnitude(Vector.sub(a.velocity, b.velocity));
        const s = p.collision.supports && p.collision.supports[0];
        const pt = s ? { x: s.x, y: s.y } : { x: (a.position.x + b.position.x) / 2, y: (a.position.y + b.position.y) / 2 };

        for (const proj of [a, b]) {
          if (proj.label === 'projectile' && proj.plugin.type === 'bomb' && !proj.plugin.exploded) {
            proj.plugin.exploded = true;
            explodeQueue.push(proj);
          }
        }

        const brokeA = applyImpact(a, b, rel, pt);
        const brokeB = applyImpact(b, a, rel, pt);
        if (brokeA && a.label === 'block' && b.label === 'projectile') punchThrough(p, b, a);
        if (brokeB && b.label === 'block' && a.label === 'projectile') punchThrough(p, a, b);

        const blk = a.label === 'block' ? a : b.label === 'block' ? b : null;
        if (blk && rel > 3.5) {
          spawnChips(pt.x, pt.y, Math.min(10, Math.floor(rel)), blk.plugin.mat);
          if (simTime - lastThud > 70) {
            lastThud = simTime;
            sfx.thud(Math.min(1, rel / 14), blk.plugin.mat);
          }
          if (rel > 9) shake = Math.max(shake, Math.min(9, rel * 0.5));
        }
      }
    });

    // A projectile that breaks a block keeps flying, minus some momentum
    function punchThrough(pair, proj, block) {
      pair.isActive = false;
      const keep = proj.mass / (proj.mass + block.mass * 0.6);
      Body.setVelocity(proj, Vector.mult(proj.velocity, keep));
    }

    function addScore(n, x, y, color) {
      score += n;
      particles.push({ kind: 'text', text: '+' + fmt(n), x, y, vx: 0, vy: -1.1, g: 0.012, drag: 1, life: 0, max: 70, color });
      scoreEl.classList.add('bump');
      setTimeout(() => scoreEl.classList.remove('bump'), 150);
    }

    function breakBlock(b) {
      Composite.remove(engine.world, b);
      blocks = blocks.filter(o => o !== b);
      const { x, y } = b.position;
      const { mat, w, h } = b.plugin;
      const n = Math.min(26, 8 + Math.floor((w * h) / 250));
      const c = Math.cos(b.angle), s = Math.sin(b.angle);
      for (let i = 0; i < n; i++) {
        const lx = (Math.random() - 0.5) * w, ly = (Math.random() - 0.5) * h;
        const sp = 1 + Math.random() * 4;
        const a = Math.random() * Math.PI * 2;
        particles.push(debris(mat, x + lx * c - ly * s, y + lx * s + ly * c,
          Math.cos(a) * sp + b.velocity.x * 0.5, Math.sin(a) * sp - 2 + b.velocity.y * 0.5));
      }
      if (mat === 'stone' || mat === 'wood') {
        for (let i = 0; i < 5; i++) {
          particles.push({
            kind: 'smoke', x: x + (Math.random() - 0.5) * w, y: y + (Math.random() - 0.5) * h,
            vx: (Math.random() - 0.5), vy: -0.4, life: 0, max: 50, size: 10 + Math.random() * 10, g: -0.01, drag: 0.97,
            color: mat === 'stone' ? [170, 170, 190] : [190, 160, 130]
          });
        }
      } else {
        for (let i = 0; i < 6; i++) spawnSparks(x + (Math.random() - 0.5) * w, y + (Math.random() - 0.5) * h, 1, [200, 240, 255]);
      }
      sfx.breakMat(mat);
      addScore(MATS[mat].score, x, y - 10, [255, 240, 210]);
    }

    function defeatEnemy(e) {
      Composite.remove(engine.world, e);
      enemies = enemies.filter(o => o !== e);
      const { x, y } = e.position;
      const glow = ENEMIES[e.plugin.kind].glow;
      for (let i = 0; i < 46; i++) {
        const a = Math.random() * Math.PI * 2;
        const sp = 2 + Math.random() * 9;
        particles.push({
          kind: 'glow', x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 2,
          life: 0, max: 40 + Math.random() * 40, size: 3 + Math.random() * 6, g: 0.12, drag: 0.95,
          color: Math.random() > 0.3 ? glow : [255, 244, 214]
        });
      }
      particles.push({ kind: 'ring', x, y, life: 0, max: 34, size: 20, color: glow });
      particles.push({ kind: 'flash', x, y, life: 0, max: 18, size: 140, color: glow });
      particles.push({ kind: 'ghost', x, y, vx: 0, vy: -1.4, g: 0, drag: 0.99, life: 0, max: 60, size: ENEMIES[e.plugin.kind].r, color: glow });

      for (const b of blocks) {
        const d = Vector.sub(b.position, e.position);
        const dist = Vector.magnitude(d);
        if (dist < 140 && dist > 0) {
          Body.applyForce(b, b.position, Vector.mult(Vector.normalise(d), (1 - dist / 140) * 0.012 * b.mass));
        }
      }
      shake = Math.max(shake, 9);
      sfx.pop();
      addScore(ENEMY_SCORE, x, y - 30, glow);
      updateHud();
    }

    function explode(proj) {
      const { x, y } = proj.position;
      const R = 190;
      if (ball === proj) {
        Composite.remove(engine.world, proj);
        ball = null;
        state = 'settling';
        settleTimer = 0;
      }
      for (const b of [...blocks, ...enemies]) {
        if (b.plugin.dead) continue;
        const d = Vector.sub(b.position, { x, y });
        const dist = Vector.magnitude(d);
        if (dist > R) continue;
        const k = 1 - dist / R;
        const dir = dist > 0 ? Vector.normalise(d) : { x: 0, y: -1 };
        const dv = (k * 18) / Math.sqrt(Math.max(1, b.mass / 4));
        Body.setVelocity(b, { x: b.velocity.x + dir.x * dv, y: b.velocity.y + dir.y * dv - k * 3 });
        Body.setAngularVelocity(b, b.angularVelocity + (Math.random() - 0.5) * 0.3 * k);
        b.plugin.hp -= k * (b.label === 'enemy' ? 300 : 220);
        if (b.label === 'enemy') b.plugin.flash = 1;
        if (b.plugin.hp <= 0) { b.plugin.dead = true; breakQueue.push(b); }
      }

      for (let i = 0; i < 70; i++) {
        const a = Math.random() * Math.PI * 2;
        const sp = 2 + Math.random() * 11;
        particles.push({
          kind: 'glow', x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 1.5,
          life: 0, max: 25 + Math.random() * 35, size: 5 + Math.random() * 9, g: 0.08, drag: 0.92,
          color: Math.random() > 0.4 ? [255, 140, 50] : [255, 220, 120]
        });
      }
      for (let i = 0; i < 18; i++) {
        const a = Math.random() * Math.PI * 2;
        const sp = 1 + Math.random() * 3;
        particles.push({
          kind: 'smoke', x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 1,
          life: 0, max: 70 + Math.random() * 30, size: 18 + Math.random() * 20, g: -0.02, drag: 0.95, color: [90, 70, 90]
        });
      }
      particles.push({ kind: 'ring', x, y, life: 0, max: 30, size: 30, color: [255, 200, 120], grow: 170 });
      particles.push({ kind: 'flash', x, y, life: 0, max: 22, size: 260, color: [255, 180, 90] });
      shake = 16;
      sfx.boom();
    }

    // ---------------------------------------------------------------
    // Particles
    // ---------------------------------------------------------------
    function debris(mat, x, y, vx, vy) {
      const base = { x, y, vx, vy, life: 0, rot: Math.random() * 6, vr: (Math.random() - 0.5) * 0.4, drag: 0.98 };
      if (mat === 'glass') return { ...base, kind: 'shard', max: 50 + Math.random() * 30, size: 3 + Math.random() * 6, g: 0.28, color: [200, 240, 255] };
      if (mat === 'stone') return { ...base, kind: 'chip', max: 60 + Math.random() * 30, size: 3 + Math.random() * 5, g: 0.35, color: Math.random() > 0.5 ? [140, 148, 166] : [96, 102, 120] };
      return { ...base, kind: 'chip', max: 50 + Math.random() * 30, size: 2 + Math.random() * 4, g: 0.25, color: Math.random() > 0.5 ? [196, 132, 82] : [150, 96, 60] };
    }

    function spawnChips(x, y, n, mat) {
      for (let i = 0; i < n; i++) {
        const a = Math.random() * Math.PI * 2;
        const sp = 1 + Math.random() * 3;
        const p = debris(mat, x, y, Math.cos(a) * sp, Math.sin(a) * sp - 2);
        p.size *= 0.6;
        particles.push(p);
      }
    }

    function spawnSparks(x, y, n, color) {
      for (let i = 0; i < n; i++) {
        const a = Math.random() * Math.PI * 2;
        const sp = 1 + Math.random() * 3;
        particles.push({
          kind: 'glow', x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
          life: 0, max: 22 + Math.random() * 14, size: 2 + Math.random() * 3, g: 0.05, drag: 0.94, color
        });
      }
    }

    function spawnPuff(x, y, color) {
      for (let i = 0; i < 14; i++) {
        const a = Math.random() * Math.PI * 2;
        const sp = 0.5 + Math.random() * 2;
        particles.push({
          kind: 'smoke', x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 0.6,
          life: 0, max: 40 + Math.random() * 20, size: 10 + Math.random() * 12, g: -0.02, drag: 0.95, color: [200, 220, 235]
        });
      }
      spawnSparks(x, y, 10, color);
    }

    function spawnConfetti() {
      const colors = [[255, 196, 90], [255, 120, 170], [127, 227, 212], [190, 160, 255], [255, 244, 214]];
      for (let i = 0; i < 160; i++) {
        const left = i % 2 === 0;
        particles.push({
          kind: 'confetti',
          x: left ? -20 : W + 20, y: 300 + Math.random() * 300,
          vx: (left ? 1 : -1) * (6 + Math.random() * 12), vy: -8 - Math.random() * 10,
          g: 0.22, drag: 0.985, life: 0, max: 160 + Math.random() * 80,
          rot: Math.random() * 6, vr: (Math.random() - 0.5) * 0.5, size: 5 + Math.random() * 5, flip: Math.random() * 6,
          color: colors[i % colors.length]
        });
      }
    }

    function updateParticles() {
      for (const p of particles) {
        p.life++;
        if (p.vx !== undefined) {
          p.vx *= p.drag;
          p.vy = p.vy * p.drag + p.g;
          p.x += p.vx;
          p.y += p.vy;
          if (p.rot !== undefined) p.rot += p.vr;
          if (p.flip !== undefined) p.flip += 0.15;
          if ((p.kind === 'chip' || p.kind === 'shard') && p.y > GROUND - 2) {
            p.y = GROUND - 2; p.vy *= -0.3; p.vx *= 0.7; p.vr *= 0.7;
          }
        }
      }
      particles = particles.filter(p => p.life < p.max);
      if (particles.length > 900) particles.splice(0, particles.length - 900);
    }

    // ---------------------------------------------------------------
    // Game state
    // ---------------------------------------------------------------
    let level = 0;
    let state = 'menu';            // menu | ready | aiming | flying | settling | over
    let ammo = { normal: 0, heavy: 0, bomb: 0 };
    let selected = 'normal';
    let pull = { x: 0, y: 0 };
    let score = 0, shownScore = 0;
    let simTime = 0;
    let flightTime = 0, stillFrames = 0, settleTimer = 0, winTimer = -1;
    let shake = 0, loadAnim = 1, bandSnap = 0;
    let shotsFired = 0;
    let won = false;

    const scoreEl = document.getElementById('score');
    const menuEl = document.getElementById('menu');
    const resultEl = document.getElementById('result');
    const hint = document.getElementById('hint');
    const trayButtons = [...document.querySelectorAll('.ammo')];

    const ammoLeft = () => ammo.normal + ammo.heavy + ammo.bomb;
    const enemyTotals = LEVELS.map(lv => {
      let n = 0;
      const noop = () => {};
      lv.build({ post: noop, beam: noop, box: noop, imp: () => n++ });
      return n;
    });

    function startLevel(i) {
      level = i;
      buildLevel(i);
      ammo = { ...LEVELS[i].ammo };
      selected = AMMO_ORDER.find(t => ammo[t] > 0);
      score = shownScore = 0;
      state = 'ready';
      pull = { x: 0, y: 0 };
      flightTime = stillFrames = settleTimer = shotsFired = 0;
      winTimer = -1;
      won = false;
      loadAnim = 0;
      menuEl.classList.add('hidden');
      resultEl.classList.add('hidden');
      document.getElementById('tray').classList.remove('hidden-el');
      document.getElementById('levelNum').textContent = 'Level ' + (i + 1);
      document.getElementById('levelName').textContent = LEVELS[i].name;
      showHint(i === 0 ? '<b>Drag the stone back</b> and release to launch' : null);
      updateHud();
    }

    let hintTimer = 0;
    function showHint(html, ms) {
      clearTimeout(hintTimer);
      if (!html) { hint.classList.add('hidden'); return; }
      hint.innerHTML = html;
      hint.classList.remove('hidden');
      if (ms) hintTimer = setTimeout(() => hint.classList.add('hidden'), ms);
    }

    function updateHud() {
      const ip = document.getElementById('impPips');
      ip.innerHTML = '';
      for (let i = 0; i < enemyTotals[level]; i++) {
        const d = document.createElement('span');
        d.className = 'imp-pip' + (i < enemies.length ? '' : ' out');
        ip.appendChild(d);
      }
      for (const btn of trayButtons) {
        const t = btn.dataset.type;
        btn.querySelector('.count').textContent = ammo[t];
        btn.disabled = ammo[t] <= 0;
        btn.classList.toggle('selected', t === selected && ammo[t] > 0);
        btn.style.display = LEVELS[level].ammo[t] > 0 ? '' : 'none';
      }
    }

    function select(type) {
      if (ammo[type] <= 0 || state === 'aiming' || state === 'over' || state === 'menu') return;
      if (selected !== type) {
        selected = type;
        if (state === 'ready') loadAnim = 0.4;
        sfx.click();
        if (type === 'bomb') showHint('<b>Ember bomb</b> explodes on impact. Tap mid-flight to detonate early', 3500);
        if (type === 'heavy') showHint('<b>Boulder</b> is heavy: it smashes stone and punches through', 3000);
      }
      updateHud();
    }

    function launch() {
      const len = Math.hypot(pull.x, pull.y);
      if (len < 18) { state = 'ready'; pull = { x: 0, y: 0 }; return; }
      const type = selected;
      const cfg = AMMO[type];
      const pos = ballRestPos();
      ball = Bodies.circle(pos.x, pos.y, cfg.r, {
        density: cfg.density, restitution: cfg.restitution, friction: 0.6, frictionAir: 0.002, label: 'projectile'
      });
      ball.plugin = { type, exploded: false };
      Composite.add(engine.world, ball);
      Body.setVelocity(ball, { x: pull.x * cfg.power, y: pull.y * cfg.power });
      Body.setAngularVelocity(ball, 0.05 + len * 0.0008);
      armed = true;
      ammo[type]--;
      shotsFired++;
      if (ammo[selected] <= 0) selected = AMMO_ORDER.find(t => ammo[t] > 0) || selected;
      state = 'flying';
      flightTime = 0;
      stillFrames = 0;
      bandSnap = 1;
      pull = { x: 0, y: 0 };
      if (type !== 'bomb') showHint(null);
      sfx.launch(len / MAX_PULL, type);
      updateHud();
    }

    function ballRestPos() {
      const r = AMMO[selected].r;
      const p = { x: SLING.anchor.x - pull.x, y: SLING.anchor.y - pull.y };
      p.y = Math.min(p.y, GROUND - r - 2);
      return p;
    }

    function endShot() {
      if (ball) {
        spawnPuff(ball.position.x, ball.position.y, AMMO[ball.plugin.type].trail);
        Composite.remove(engine.world, ball);
        ball = null;
      }
      state = 'settling';
      settleTimer = 0;
    }

    function finish(win) {
      state = 'over';
      won = win;
      armed = false;
      const card = document.getElementById('resultCard');
      card.classList.toggle('lose', !win);
      document.getElementById('resultTitle').textContent = win ? 'You win' : 'Try again';

      let bonus = 0;
      let stars = 0;
      if (win) {
        bonus = ammoLeft() * AMMO_BONUS;
        score += bonus;
        const base = enemyTotals[level] * ENEMY_SCORE;
        stars = score >= base + 14000 ? 3 : score >= base + 7000 ? 2 : 1;
        progress.best[level] = Math.max(progress.best[level] || 0, score);
        progress.stars[level] = Math.max(progress.stars[level] || 0, stars);
        saveProgress();
        spawnConfetti();
      }

      const starEls = document.querySelectorAll('#resultStars .star');
      starEls.forEach((s, i) => {
        s.classList.remove('on');
        s.style.animationDelay = (0.35 + i * 0.3) + 's';
      });
      void card.offsetWidth;
      starEls.forEach((s, i) => {
        if (i < stars) {
          s.classList.add('on');
          setTimeout(() => sfx.star(i), 350 + i * 300);
        }
      });
      document.getElementById('resultStars').style.display = win ? '' : 'none';

      const left = enemies.length;
      document.getElementById('resultBonus').textContent = win && bonus ? `Unused ammo bonus +${fmt(bonus)}` : '';
      document.getElementById('resultText').textContent = win
        ? (level < LEVELS.length - 1 ? `${LEVELS[level + 1].name} is now open.` : 'Every fort in the grove has fallen. Well slung!')
        : `${left} imp${left === 1 ? ' is' : 's are'} still causing mischief.`;
      const hasNext = win && level < LEVELS.length - 1;
      document.getElementById('btnNext').textContent = win ? (hasNext ? 'Next level' : 'Play again') : 'Try again';
      document.getElementById('btnReplay').classList.toggle('hidden-el', !hasNext);

      // Count the score up
      const target = score;
      const scoreOut = document.getElementById('resultScore');
      scoreOut.textContent = '0';
      setTimeout(() => {
        const t0 = performance.now();
        const tick = now => {
          const k = Math.min(1, (now - t0) / 900);
          scoreOut.textContent = fmt(target * (1 - Math.pow(1 - k, 3)));
          if (k < 1) requestAnimationFrame(tick);
        };
        requestAnimationFrame(tick);
      }, 250);

      resultEl.classList.remove('hidden');
      showHint(null);
      win ? sfx.win() : sfx.lose();
    }

    function detonate() {
      if (state === 'flying' && ball && ball.plugin.type === 'bomb' && !ball.plugin.exploded) {
        ball.plugin.exploded = true;
        explodeQueue.push(ball);
        return true;
      }
      return false;
    }

    function stepGame() {
      simTime += STEP;

      for (const p of explodeQueue) explode(p);
      explodeQueue = [];
      for (const b of breakQueue) (b.label === 'enemy' ? defeatEnemy : breakBlock)(b);
      breakQueue = [];

      for (const e of enemies) {
        e.plugin.flash = Math.max(0, e.plugin.flash - 0.05);
        if (!e.plugin.dead && (e.position.y > H + 200 || e.position.x > W + 300 || e.position.x < -300)) {
          e.plugin.dead = true;
          breakQueue.push(e);
        }
      }
      blocks = blocks.filter(b => {
        if (b.position.y > H + 300 || b.position.x > W + 400) {
          Composite.remove(engine.world, b);
          return false;
        }
        return true;
      });

      if (state !== 'over' && state !== 'menu' && enemies.length === 0 && breakQueue.length === 0) {
        if (winTimer < 0) winTimer = 0;
        winTimer += STEP;
        if (winTimer > 1000) finish(true);
      }

      if (state === 'flying' && ball) {
        flightTime += STEP;
        stillFrames = ball.speed < 1.2 ? stillFrames + 1 : 0;
        const p = ball.position;
        const gone = p.x > W + 150 || p.x < -150 || p.y > H + 100;
        if (gone || (stillFrames > 20 && flightTime > 600) || flightTime > 5000) {
          if (!gone && !detonate()) endShot();
          if (gone) endShot();
        }
        if (ball && ball.speed > 4 && Math.random() < 0.7) {
          particles.push({
            kind: 'glow', x: p.x + (Math.random() - 0.5) * 8, y: p.y + (Math.random() - 0.5) * 8,
            vx: 0, vy: 0, life: 0, max: 26, size: 4 + Math.random() * 3, g: 0, drag: 1, color: AMMO[ball.plugin.type].trail
          });
        }
      } else if (state === 'settling') {
        settleTimer += STEP;
        if (winTimer < 0) {
          if (ammoLeft() > 0 && settleTimer > 250) {
            state = 'ready';
            loadAnim = 0;
          } else if (ammoLeft() === 0 && settleTimer > 1500) {
            // Give the fort a chance to finish collapsing before calling it
            const calm = [...blocks, ...enemies].every(b => b.speed < 0.3);
            if (calm || settleTimer > 7000) finish(false);
          }
        }
      } else if (state === 'over' && !won) {
        // Surviving imps celebrate
        for (const e of enemies) {
          e.plugin.hop -= STEP;
          if (e.plugin.hop <= 0 && Math.abs(e.velocity.y) < 0.3) {
            Body.setVelocity(e, { x: e.velocity.x, y: -4.5 });
            e.plugin.hop = 700 + Math.random() * 500;
          }
        }
      }

      const fuse = fusePos();
      if (fuse && Math.random() < 0.6) {
        particles.push({
          kind: 'glow', x: fuse.x, y: fuse.y, vx: (Math.random() - 0.5) * 1.5, vy: -Math.random() * 1.5,
          life: 0, max: 14 + Math.random() * 10, size: 2 + Math.random() * 2, g: 0.06, drag: 0.95, color: [255, 210, 120]
        });
      }

      loadAnim = Math.min(1, loadAnim + 0.06);
      bandSnap *= 0.86;
      updateParticles();
    }

    // ---------------------------------------------------------------
    // Input
    // ---------------------------------------------------------------
    let activePointer = null;

    canvas.addEventListener('pointerdown', e => {
      sfx.unlock();
      if (detonate()) return;
      if (state !== 'ready' || loadAnim < 1) return;
      const w = toWorld(e.clientX, e.clientY);
      const rest = ballRestPos();
      if (Math.hypot(w.x - rest.x, w.y - rest.y) < 90) {
        state = 'aiming';
        activePointer = e.pointerId;
        canvas.setPointerCapture(e.pointerId);
        canvas.classList.add('grabbing');
        updatePull(w);
        sfx.stretch();
      }
    });

    canvas.addEventListener('pointermove', e => {
      const w = toWorld(e.clientX, e.clientY);
      if (state === 'aiming' && e.pointerId === activePointer) {
        updatePull(w);
      } else {
        const rest = ballRestPos();
        canvas.classList.toggle('can-grab', state === 'ready' && Math.hypot(w.x - rest.x, w.y - rest.y) < 90);
        canvas.classList.toggle('can-detonate', state === 'flying' && !!ball && ball.plugin.type === 'bomb');
      }
    });

    canvas.addEventListener('pointerup', e => {
      if (state !== 'aiming' || e.pointerId !== activePointer) return;
      activePointer = null;
      canvas.classList.remove('grabbing');
      launch();
    });
    canvas.addEventListener('pointercancel', () => {
      if (state === 'aiming') { state = 'ready'; pull = { x: 0, y: 0 }; activePointer = null; canvas.classList.remove('grabbing'); }
    });

    function updatePull(w) {
      let dx = SLING.anchor.x - w.x, dy = SLING.anchor.y - w.y;
      const len = Math.hypot(dx, dy);
      if (len > MAX_PULL) { dx *= MAX_PULL / len; dy *= MAX_PULL / len; }
      pull = { x: dx, y: dy };
    }

    trayButtons.forEach(btn => btn.addEventListener('click', () => { sfx.unlock(); select(btn.dataset.type); }));

    function openMenu() {
      renderLevelGrid();
      menuEl.classList.remove('hidden');
      resultEl.classList.add('hidden');
      if (state === 'aiming') { state = 'ready'; pull = { x: 0, y: 0 }; }
    }

    function renderLevelGrid() {
      const grid = document.getElementById('levelGrid');
      grid.innerHTML = '';
      LEVELS.forEach((lv, i) => {
        const b = document.createElement('button');
        b.className = 'level-card';
        b.disabled = !isUnlocked(i);
        const st = progress.stars[i] || 0;
        b.innerHTML = `
          <div class="diff">${lv.diff}</div>
          <div class="num">${b.disabled ? '&#128274;' : i + 1}</div>
          <div class="nm">${lv.name}</div>
          <div class="mini-stars">${[0, 1, 2].map(k => `<span class="${k < st ? 'on' : ''}"></span>`).join('')}</div>
          <div class="best">${progress.best[i] ? 'Best ' + fmt(progress.best[i]) : (b.disabled ? 'Locked' : 'Not cleared')}</div>`;
        b.addEventListener('click', () => { sfx.unlock(); sfx.click(); startLevel(i); });
        grid.appendChild(b);
      });
    }

    document.getElementById('restartBtn').addEventListener('click', () => { sfx.unlock(); if (state !== 'menu') startLevel(level); });
    document.getElementById('levelsBtn').addEventListener('click', () => { sfx.unlock(); openMenu(); });
    document.getElementById('btnLevels').addEventListener('click', () => { sfx.click(); openMenu(); });
    document.getElementById('btnReplay').addEventListener('click', () => { sfx.click(); startLevel(level); });
    document.getElementById('btnNext').addEventListener('click', () => {
      sfx.click();
      if (won && level < LEVELS.length - 1) startLevel(level + 1);
      else startLevel(won ? 0 : level);
    });
    window.addEventListener('keydown', e => {
      const menuOpen = !menuEl.classList.contains('hidden');
      if ((e.key === 'r' || e.key === 'R') && !menuOpen && state !== 'menu') startLevel(level);
      if (e.key === '1') select('normal');
      if (e.key === '2') select('heavy');
      if (e.key === '3') select('bomb');
      if (e.key === ' ') { e.preventDefault(); detonate(); }
      if (e.key === 'Escape' && state !== 'menu') {
        if (menuOpen) menuEl.classList.add('hidden'); else openMenu();
      }
    });

    // ---------------------------------------------------------------
    // Sound (tiny WebAudio synth)
    // ---------------------------------------------------------------
    const sfx = (() => {
      let ac = null, master = null, muted = false;
      try { muted = localStorage.getItem('lg-muted') === '1'; } catch (e) {}
      const btn = document.getElementById('muteBtn');
      const icon = () => {
        btn.innerHTML = muted
          ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="m22 9-6 6M16 9l6 6"/></svg>'
          : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/></svg>';
      };
      icon();
      btn.addEventListener('click', () => {
        muted = !muted;
        try { localStorage.setItem('lg-muted', muted ? '1' : '0'); } catch (e) {}
        if (master) master.gain.value = muted ? 0 : 0.5;
        icon();
      });

      function unlock() {
        if (!ac) {
          try {
            ac = new (window.AudioContext || window.webkitAudioContext)();
            master = ac.createGain();
            master.gain.value = muted ? 0 : 0.5;
            master.connect(ac.destination);
          } catch (e) { ac = null; }
        }
        if (ac && ac.state === 'suspended') ac.resume();
      }

      function tone(freq, dur, { type = 'sine', vol = 0.2, to = null, delay = 0 } = {}) {
        if (!ac || muted) return;
        const t = ac.currentTime + delay;
        const o = ac.createOscillator(), g = ac.createGain();
        o.type = type;
        o.frequency.setValueAtTime(freq, t);
        if (to) o.frequency.exponentialRampToValueAtTime(to, t + dur);
        g.gain.setValueAtTime(0.0001, t);
        g.gain.exponentialRampToValueAtTime(vol, t + 0.01);
        g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
        o.connect(g).connect(master);
        o.start(t);
        o.stop(t + dur + 0.05);
      }

      function noise(dur, { vol = 0.2, f0 = 800, f1 = 3000, q = 1, type = 'bandpass' } = {}) {
        if (!ac || muted) return;
        const t = ac.currentTime;
        const buf = ac.createBuffer(1, Math.floor(ac.sampleRate * dur), ac.sampleRate);
        const d = buf.getChannelData(0);
        for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
        const src = ac.createBufferSource();
        src.buffer = buf;
        const f = ac.createBiquadFilter();
        f.type = type;
        f.Q.value = q;
        f.frequency.setValueAtTime(f0, t);
        f.frequency.exponentialRampToValueAtTime(f1, t + dur);
        const g = ac.createGain();
        g.gain.setValueAtTime(vol, t);
        g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
        src.connect(f).connect(g).connect(master);
        src.start(t);
      }

      let lastBreak = 0, lastCreak = 0;
      const now = () => (ac ? ac.currentTime : 0);

      return {
        unlock,
        click: () => tone(660, 0.08, { type: 'triangle', vol: 0.08, to: 880 }),
        stretch: () => tone(180, 0.12, { type: 'triangle', vol: 0.06, to: 240 }),
        launch: (p, type) => {
          noise(0.35, { vol: 0.25 + p * 0.25, f0: 400, f1: 2400 });
          tone(type === 'heavy' ? 140 : 220, 0.15, { type: 'triangle', vol: 0.12, to: 70 });
        },
        thud: (p, mat) => {
          if (mat === 'glass') tone(1800 + Math.random() * 800, 0.12, { vol: 0.05 + p * 0.08 });
          else if (mat === 'stone') { tone(80, 0.2, { type: 'triangle', vol: 0.15 + p * 0.25, to: 40 }); noise(0.1, { vol: 0.1 * p, f0: 500, f1: 200 }); }
          else { tone(110 + Math.random() * 30, 0.18, { type: 'triangle', vol: 0.12 + p * 0.25, to: 50 }); noise(0.08, { vol: 0.08 * p, f0: 900, f1: 300 }); }
        },
        creak: mat => {
          if (now() - lastCreak < 0.08) return;
          lastCreak = now();
          if (mat === 'glass') tone(2400, 0.08, { vol: 0.05, to: 2000 });
          else if (mat === 'wood') tone(260, 0.12, { type: 'sawtooth', vol: 0.03, to: 180 });
        },
        breakMat: mat => {
          if (now() - lastBreak < 0.05) return;
          lastBreak = now();
          if (mat === 'glass') {
            noise(0.4, { vol: 0.22, f0: 6000, f1: 3000, type: 'highpass' });
            for (let i = 0; i < 4; i++) tone(2000 + Math.random() * 2500, 0.25, { vol: 0.05, delay: i * 0.035 });
          } else if (mat === 'stone') {
            noise(0.45, { vol: 0.35, f0: 600, f1: 120, type: 'lowpass' });
            tone(70, 0.3, { type: 'triangle', vol: 0.25, to: 35 });
          } else {
            noise(0.25, { vol: 0.28, f0: 1400, f1: 300, q: 2 });
            tone(160, 0.15, { type: 'square', vol: 0.05, to: 80 });
          }
        },
        ping: () => tone(880, 0.2, { vol: 0.08, to: 700 }),
        pop: () => {
          noise(0.25, { vol: 0.2, f0: 3000, f1: 600 });
          [659, 988, 1319].forEach((f, i) => tone(f, 0.5, { vol: 0.12, delay: i * 0.07 }));
        },
        boom: () => {
          noise(1.1, { vol: 0.7, f0: 900, f1: 60, type: 'lowpass' });
          tone(90, 0.7, { vol: 0.45, to: 28 });
        },
        star: i => tone([784, 988, 1319][i], 0.45, { type: 'triangle', vol: 0.14 }),
        win: () => [523, 659, 784, 1047].forEach((f, i) => tone(f, 0.6, { type: 'triangle', vol: 0.11, delay: i * 0.09 })),
        lose: () => [392, 330, 262].forEach((f, i) => tone(f, 0.5, { type: 'triangle', vol: 0.1, delay: i * 0.16 }))
      };
    })();

    // ---------------------------------------------------------------
    // Rendering
    // ---------------------------------------------------------------
    const fireflies = Array.from({ length: 22 }, () => ({
      x: Math.random() * W, y: 380 + Math.random() * 400, p: Math.random() * 100, s: 0.4 + Math.random() * 0.8
    }));

    function drawFireflies(t) {
      ctx.globalCompositeOperation = 'lighter';
      for (const f of fireflies) {
        const x = f.x + Math.sin(t * 0.0004 * f.s + f.p) * 40;
        const y = f.y + Math.cos(t * 0.0006 * f.s + f.p * 2) * 25;
        const a = 0.25 + 0.35 * Math.max(0, Math.sin(t * 0.002 * f.s + f.p));
        const g = ctx.createRadialGradient(x, y, 0, x, y, 9);
        g.addColorStop(0, `rgba(220, 255, 190, ${a})`);
        g.addColorStop(1, 'rgba(220, 255, 190, 0)');
        ctx.fillStyle = g;
        ctx.fillRect(x - 9, y - 9, 18, 18);
      }
      ctx.globalCompositeOperation = 'source-over';
    }

    function drawShadows() {
      ctx.fillStyle = 'rgba(5, 3, 15, 0.35)';
      const list = [...blocks, ...enemies];
      if (ball) list.push(ball);
      for (const b of list) {
        const dist = GROUND - b.bounds.max.y;
        if (dist < -4 || dist > 220) continue;
        const w = (b.bounds.max.x - b.bounds.min.x) * 0.55 * (1 - dist / 300);
        ctx.globalAlpha = 0.6 * (1 - dist / 220) * (b.plugin.mat === 'glass' ? 0.5 : 1);
        ctx.beginPath();
        ctx.ellipse(b.position.x, GROUND + 3, w, 5, 0, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.globalAlpha = 1;
    }

    const WOOD = [
      ['#d9a066', '#b8773f', '#8c5428'],
      ['#e0ad74', '#c1854b', '#94602f'],
      ['#cf955c', '#a96a36', '#7d4920']
    ];

    function drawCracks(b, color) {
      const { hp, maxHp, cracks } = b.plugin;
      const k = hp / maxHp;
      if (k > 0.75) return;
      const n = k > 0.5 ? 1 : k > 0.25 ? 2 : 3;
      ctx.strokeStyle = color;
      ctx.lineWidth = 1.4;
      ctx.beginPath();
      for (let i = 0; i < n; i++) {
        const pts = cracks[i];
        ctx.moveTo(pts[0][0], pts[0][1]);
        for (let j = 1; j < pts.length; j++) ctx.lineTo(pts[j][0], pts[j][1]);
      }
      ctx.stroke();
    }

    function drawBlock(b) {
      ctx.save();
      ctx.translate(b.position.x, b.position.y);
      ctx.rotate(b.angle);
      if (b.plugin.mat === 'wood') drawWood(b);
      else if (b.plugin.mat === 'glass') drawGlass(b);
      else drawStoneBlock(b);
      ctx.restore();
    }

    function drawWood(b) {
      const { w, h, grain, hue, knot } = b.plugin;
      const pal = WOOD[Math.floor(hue * WOOD.length)];
      const horiz = w >= h;
      const g = horiz ? ctx.createLinearGradient(0, -h / 2, 0, h / 2) : ctx.createLinearGradient(-w / 2, 0, w / 2, 0);
      g.addColorStop(0, pal[0]);
      g.addColorStop(0.55, pal[1]);
      g.addColorStop(1, pal[2]);
      roundRect(ctx, -w / 2, -h / 2, w, h, 4);
      ctx.fillStyle = g;
      ctx.fill();

      ctx.save();
      ctx.clip();
      ctx.strokeStyle = 'rgba(90, 48, 20, 0.35)';
      ctx.lineWidth = 1.2;
      const along = horiz ? w : h, across = horiz ? h : w;
      for (const gr of grain) {
        const c = -across / 2 + gr.o * across;
        const start = -along / 2 + gr.a * along * 0.3;
        const len = along * gr.l;
        ctx.beginPath();
        if (horiz) {
          ctx.moveTo(start, c);
          ctx.quadraticCurveTo(start + len / 2, c + (gr.a - 0.5) * 4, start + len, c);
        } else {
          ctx.moveTo(c, start);
          ctx.quadraticCurveTo(c + (gr.a - 0.5) * 4, start + len / 2, c, start + len);
        }
        ctx.stroke();
      }
      if (knot) {
        const kx = horiz ? -w / 2 + knot.u * w : -w / 2 + knot.v * w;
        const ky = horiz ? -h / 2 + knot.v * h : -h / 2 + knot.u * h;
        ctx.fillStyle = 'rgba(90, 48, 20, 0.45)';
        ctx.beginPath();
        ctx.ellipse(kx, ky, horiz ? 4 : 2.5, horiz ? 2.5 : 4, 0, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.fillStyle = 'rgba(255, 235, 200, 0.25)';
      if (horiz) ctx.fillRect(-w / 2, -h / 2, w, 3); else ctx.fillRect(-w / 2, -h / 2, 3, h);
      drawCracks(b, 'rgba(60, 28, 10, 0.85)');
      ctx.restore();

      roundRect(ctx, -w / 2, -h / 2, w, h, 4);
      ctx.lineWidth = 2;
      ctx.strokeStyle = '#5a3417';
      ctx.stroke();

      if (Math.min(w, h) >= 18) {
        ctx.fillStyle = '#6b4120';
        for (const [px, py] of [[-w / 2 + 6, -h / 2 + 6], [w / 2 - 6, h / 2 - 6]]) {
          ctx.beginPath();
          ctx.arc(px, py, 1.8, 0, Math.PI * 2);
          ctx.fill();
        }
      }
    }

    function drawGlass(b) {
      const { w, h } = b.plugin;
      const g = ctx.createLinearGradient(-w / 2, -h / 2, w / 2, h / 2);
      g.addColorStop(0, 'rgba(200, 240, 255, 0.55)');
      g.addColorStop(0.5, 'rgba(140, 200, 240, 0.3)');
      g.addColorStop(1, 'rgba(120, 170, 230, 0.45)');
      roundRect(ctx, -w / 2, -h / 2, w, h, 3);
      ctx.fillStyle = g;
      ctx.fill();

      ctx.save();
      ctx.clip();
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.45)';
      ctx.lineWidth = 3;
      const m = Math.max(w, h);
      ctx.beginPath();
      ctx.moveTo(-m * 0.3, m * 0.5);
      ctx.lineTo(m * 0.1, -m * 0.5);
      ctx.moveTo(-m * 0.05, m * 0.5);
      ctx.lineTo(m * 0.2, -m * 0.5);
      ctx.stroke();
      drawCracks(b, 'rgba(255, 255, 255, 0.9)');
      ctx.restore();

      roundRect(ctx, -w / 2 + 1, -h / 2 + 1, w - 2, h - 2, 3);
      ctx.lineWidth = 2;
      ctx.strokeStyle = 'rgba(225, 248, 255, 0.85)';
      ctx.stroke();
      ctx.globalCompositeOperation = 'lighter';
      ctx.fillStyle = 'rgba(160, 220, 255, 0.08)';
      ctx.fillRect(-w / 2, -h / 2, w, h);
      ctx.globalCompositeOperation = 'source-over';
    }

    function drawStoneBlock(b) {
      const { w, h, specks } = b.plugin;
      const g = ctx.createLinearGradient(-w / 2, -h / 2, w / 2, h / 2);
      g.addColorStop(0, '#a9b0c2');
      g.addColorStop(0.5, '#7c8396');
      g.addColorStop(1, '#565c6e');
      roundRect(ctx, -w / 2, -h / 2, w, h, 5);
      ctx.fillStyle = g;
      ctx.fill();

      ctx.save();
      ctx.clip();
      for (const [sx, sy, s] of specks) {
        ctx.fillStyle = s > 0.5 ? 'rgba(40, 44, 58, 0.35)' : 'rgba(220, 225, 240, 0.25)';
        ctx.fillRect(sx, sy, 2 + s * 2, 2 + s * 2);
      }
      ctx.fillStyle = 'rgba(255, 255, 255, 0.18)';
      ctx.fillRect(-w / 2, -h / 2, w, 3);
      ctx.fillRect(-w / 2, -h / 2, 3, h);
      ctx.fillStyle = 'rgba(0, 0, 0, 0.2)';
      ctx.fillRect(-w / 2, h / 2 - 3, w, 3);
      drawCracks(b, 'rgba(30, 32, 44, 0.9)');
      ctx.restore();

      roundRect(ctx, -w / 2, -h / 2, w, h, 5);
      ctx.lineWidth = 2;
      ctx.strokeStyle = '#2e3340';
      ctx.stroke();
    }

    function drawEnemy(e, time) {
      const { x, y } = e.position;
      const r = e.circleRadius;
      const p = e.plugin;
      const k = ENEMIES[p.kind];
      const health = Math.max(0, p.hp / p.maxHp);
      const pulse = 0.5 + 0.5 * Math.sin(time * 0.004 + p.phase);
      const flicker = p.flash > 0 ? (Math.random() * 0.6 + 0.4) : 1;
      const bright = (0.55 + 0.45 * health) * flicker;

      ctx.globalCompositeOperation = 'lighter';
      const hr = r * (2.3 + pulse * 0.5);
      const halo = ctx.createRadialGradient(x, y, r * 0.5, x, y, hr);
      halo.addColorStop(0, rgba(k.glow, 0.5 * bright));
      halo.addColorStop(1, rgba(k.glow, 0));
      ctx.fillStyle = halo;
      ctx.fillRect(x - hr, y - hr, hr * 2, hr * 2);
      ctx.globalCompositeOperation = 'source-over';

      if (p.kind === 'sprout') {
        ctx.fillStyle = '#5fbf6a';
        ctx.strokeStyle = '#2f6b3a';
        ctx.lineWidth = 1.5;
        for (const s of [-1, 1]) {
          ctx.beginPath();
          ctx.ellipse(x + s * 7, y - r - 3, 8, 4, s * -0.5, 0, Math.PI * 2);
          ctx.fill();
          ctx.stroke();
        }
        ctx.beginPath();
        ctx.moveTo(x, y - r + 2);
        ctx.lineTo(x, y - r - 4);
        ctx.stroke();
      }

      const core = ctx.createRadialGradient(x - r * 0.3, y - r * 0.35, r * 0.1, x, y, r);
      core.addColorStop(0, k.core[0]);
      core.addColorStop(0.35, p.flash > 0.5 ? '#ffffff' : k.core[1]);
      core.addColorStop(0.8, k.core[2]);
      core.addColorStop(1, k.core[3]);
      ctx.globalAlpha = 0.7 + 0.3 * bright;
      ctx.fillStyle = core;
      ctx.beginPath();
      ctx.arc(x, y, r, 0, Math.PI * 2);
      ctx.fill();
      ctx.globalAlpha = 1;

      // Seams and cracks rotate with the body so rolling reads
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(e.angle);
      ctx.strokeStyle = 'rgba(0, 0, 0, 0.18)';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.ellipse(0, 0, r * 0.7, r, 0, 0, Math.PI * 2);
      ctx.stroke();
      if (health < 0.99) {
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.85)';
        ctx.lineWidth = 1.4;
        ctx.beginPath();
        ctx.moveTo(-r * 0.2, -r * 0.95);
        ctx.lineTo(r * 0.05, -r * 0.45);
        ctx.lineTo(-r * 0.15, -r * 0.1);
        if (health < 0.5) {
          ctx.moveTo(r * 0.9, r * 0.3);
          ctx.lineTo(r * 0.45, r * 0.15);
          ctx.lineTo(r * 0.3, r * 0.5);
        }
        ctx.stroke();
      }
      ctx.restore();

      ctx.lineWidth = 2;
      ctx.strokeStyle = 'rgba(0, 0, 0, 0.35)';
      ctx.beginPath();
      ctx.arc(x, y, r - 1, 0, Math.PI * 2);
      ctx.stroke();

      if (p.kind === 'chief') {
        ctx.fillStyle = '#ffd25a';
        ctx.strokeStyle = '#a8740e';
        ctx.lineWidth = 1.5;
        const cy = y - r + 4;
        ctx.beginPath();
        ctx.moveTo(x - 14, cy);
        ctx.lineTo(x - 16, cy - 14);
        ctx.lineTo(x - 7, cy - 6);
        ctx.lineTo(x, cy - 18);
        ctx.lineTo(x + 7, cy - 6);
        ctx.lineTo(x + 16, cy - 14);
        ctx.lineTo(x + 14, cy);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();
      }

      // Face stays upright: mischievous brows, eyes, grin
      const s = r / 24;
      const ex = r * 0.32, ey = y - r * 0.02;
      const blinking = ((time / 1000 + p.blink) % 4) < 0.12;
      const hurt = p.flash > 0.2 || health < 0.5;
      const cheer = state === 'over' && !won;
      ctx.fillStyle = k.ink;
      ctx.strokeStyle = k.ink;
      ctx.lineWidth = 2 * s;
      ctx.lineCap = 'round';
      for (const sd of [-1, 1]) {
        const cx = x + sd * ex;
        ctx.beginPath();
        if (hurt) {
          ctx.moveTo(cx - 3 * s, ey - 3 * s); ctx.lineTo(cx + 3 * s, ey + 3 * s);
          ctx.moveTo(cx + 3 * s, ey - 3 * s); ctx.lineTo(cx - 3 * s, ey + 3 * s);
          ctx.stroke();
        } else if (blinking || cheer) {
          ctx.moveTo(cx - 3.5 * s, ey + 1 * s);
          ctx.quadraticCurveTo(cx, ey - 3 * s, cx + 3.5 * s, ey + 1 * s);
          ctx.stroke();
        } else {
          ctx.ellipse(cx, ey, 2.6 * s, 3.6 * s, 0, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = 'rgba(255, 255, 255, 0.9)';
          ctx.beginPath();
          ctx.arc(cx - 0.8 * s, ey - 1.2 * s, 0.9 * s, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = k.ink;
        }
        ctx.beginPath();
        ctx.moveTo(cx - sd * 4.5 * s, ey - 8 * s);
        ctx.lineTo(cx + sd * 3 * s, ey - 5.5 * s);
        ctx.stroke();
      }
      ctx.beginPath();
      if (hurt) {
        ctx.ellipse(x, ey + 9 * s, 3 * s, 2.5 * s, 0, 0, Math.PI * 2);
        ctx.fill();
      } else {
        ctx.moveTo(x - 5 * s, ey + 7 * s);
        ctx.quadraticCurveTo(x + 1 * s, ey + (cheer ? 14 : 11) * s, x + 6 * s, ey + 6 * s);
        ctx.stroke();
      }
      ctx.fillStyle = 'rgba(255, 110, 110, 0.45)';
      for (const sd of [-1, 1]) {
        ctx.beginPath();
        ctx.ellipse(x + sd * r * 0.58, ey + 6 * s, 4 * s, 2.4 * s, 0, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.lineCap = 'butt';

      ctx.globalCompositeOperation = 'lighter';
      ctx.fillStyle = rgba(k.glow, 0.7 * bright);
      for (let i = 0; i < 3; i++) {
        const a = time * 0.0018 + p.phase + i * 2.094;
        ctx.beginPath();
        ctx.arc(x + Math.cos(a) * r * 1.5, y + Math.sin(a) * r * 0.6 - 4, 2, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.globalCompositeOperation = 'source-over';
    }

    function fusePos() {
      if ((state === 'ready' || state === 'aiming') && selected === 'bomb' && ammo.bomb > 0 && loadAnim >= 1) {
        const p = ballRestPos();
        return { x: p.x + 4, y: p.y - AMMO.bomb.r - 9 };
      }
      if (ball && ball.plugin.type === 'bomb' && !ball.plugin.exploded) {
        const a = ball.angle - Math.PI / 2 + 0.2;
        const d = AMMO.bomb.r + 9;
        return { x: ball.position.x + Math.cos(a) * d, y: ball.position.y + Math.sin(a) * d };
      }
      return null;
    }

    function drawProjectile(type, x, y, angle, alpha = 1, glow = 1) {
      const cfg = AMMO[type];
      const r = cfg.r;
      ctx.globalAlpha = alpha;
      ctx.globalCompositeOperation = 'lighter';
      const halo = ctx.createRadialGradient(x, y, r * 0.6, x, y, r * 2);
      halo.addColorStop(0, rgba(cfg.trail, 0.3 * glow));
      halo.addColorStop(1, rgba(cfg.trail, 0));
      ctx.fillStyle = halo;
      ctx.fillRect(x - r * 2, y - r * 2, r * 4, r * 4);
      ctx.globalCompositeOperation = 'source-over';

      ctx.save();
      ctx.translate(x, y);
      if (type === 'normal') {
        const g = ctx.createRadialGradient(-7, -8, 2, 0, 0, r);
        g.addColorStop(0, '#c7d5e4');
        g.addColorStop(0.45, '#5b6a80');
        g.addColorStop(1, '#232b3a');
        ctx.fillStyle = g;
        ctx.beginPath();
        ctx.arc(0, 0, r, 0, Math.PI * 2);
        ctx.fill();
        ctx.lineWidth = 2;
        ctx.strokeStyle = '#161c28';
        ctx.stroke();
        ctx.rotate(angle);
        ctx.strokeStyle = '#8ff5e6';
        ctx.shadowColor = '#7fe3d4';
        ctx.shadowBlur = 8;
        ctx.lineWidth = 2.2;
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.arc(0, 0, 9, -0.6, Math.PI * 1.2);
        ctx.moveTo(0, -12);
        ctx.lineTo(0, 4);
        ctx.moveTo(-5, 1);
        ctx.lineTo(5, 1);
        ctx.stroke();
      } else if (type === 'heavy') {
        const g = ctx.createRadialGradient(-9, -10, 2, 0, 0, r);
        g.addColorStop(0, '#c4bcd6');
        g.addColorStop(0.5, '#4a4458');
        g.addColorStop(1, '#1a1724');
        ctx.fillStyle = g;
        ctx.beginPath();
        ctx.arc(0, 0, r, 0, Math.PI * 2);
        ctx.fill();
        ctx.lineWidth = 2.5;
        ctx.strokeStyle = '#100e18';
        ctx.stroke();
        ctx.rotate(angle);
        ctx.save();
        ctx.beginPath();
        ctx.arc(0, 0, r - 1, 0, Math.PI * 2);
        ctx.clip();
        ctx.fillStyle = 'rgba(16, 14, 24, 0.55)';
        ctx.fillRect(-r, -4, r * 2, 8);
        ctx.fillRect(-4, -r, 8, r * 2);
        ctx.restore();
        ctx.fillStyle = '#d6c8ff';
        ctx.shadowColor = '#b9a0ff';
        ctx.shadowBlur = 6;
        for (const [px, py] of [[-r * 0.6, 0], [r * 0.6, 0], [0, -r * 0.6], [0, r * 0.6]]) {
          ctx.beginPath();
          ctx.arc(px, py, 2.2, 0, Math.PI * 2);
          ctx.fill();
        }
      } else {
        ctx.rotate(angle);
        ctx.strokeStyle = '#3a2a22';
        ctx.lineWidth = 4;
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(0, -r + 2);
        ctx.quadraticCurveTo(6, -r - 4, 4, -r - 8);
        ctx.stroke();
        ctx.fillStyle = '#4a3a30';
        ctx.fillRect(-6, -r - 2, 12, 6);
        const g = ctx.createRadialGradient(-7, -8, 2, 0, 0, r);
        g.addColorStop(0, '#ffc9a0');
        g.addColorStop(0.45, '#d8452a');
        g.addColorStop(1, '#4a100c');
        ctx.fillStyle = g;
        ctx.beginPath();
        ctx.arc(0, 0, r, 0, Math.PI * 2);
        ctx.fill();
        ctx.lineWidth = 2;
        ctx.strokeStyle = '#2a0806';
        ctx.stroke();
        const heat = 0.6 + 0.4 * Math.sin(simTime * 0.02);
        ctx.strokeStyle = `rgba(255, ${Math.round(180 + heat * 60)}, 90, ${0.6 + heat * 0.4})`;
        ctx.shadowColor = '#ff9a3c';
        ctx.shadowBlur = 10;
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(-r * 0.6, -r * 0.1);
        ctx.lineTo(-r * 0.2, r * 0.05);
        ctx.lineTo(-r * 0.05, -r * 0.35);
