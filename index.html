        ctx.lineTo(r * 0.35, -r * 0.15);
        ctx.moveTo(-r * 0.2, r * 0.05);
        ctx.lineTo(r * 0.1, r * 0.5);
        ctx.stroke();
      }
      ctx.restore();
      ctx.globalAlpha = 1;
    }

    function drawSlingBack() {
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      const bark = ctx.createLinearGradient(SLING.x - 20, 0, SLING.x + 20, 0);
      bark.addColorStop(0, '#4a2b1c');
      bark.addColorStop(0.5, '#7a4a2c');
      bark.addColorStop(1, '#3d2216');
      ctx.fillStyle = bark;
      ctx.beginPath();
      ctx.moveTo(SLING.x - 16, GROUND + 4);
      ctx.quadraticCurveTo(SLING.x - 8, GROUND - 60, SLING.x - 9, 722);
      ctx.lineTo(SLING.x + 11, 722);
      ctx.quadraticCurveTo(SLING.x + 10, GROUND - 60, SLING.x + 18, GROUND + 4);
      ctx.closePath();
      ctx.fill();
      ctx.strokeStyle = '#2a170e';
      ctx.lineWidth = 2;
      ctx.stroke();

      ctx.strokeStyle = '#3d2216';
      ctx.lineWidth = 15;
      ctx.beginPath();
      ctx.moveTo(SLING.x + 1, 728);
      ctx.quadraticCurveTo(SLING.x - 22, 700, SLING.back.x, SLING.back.y);
      ctx.stroke();
      ctx.strokeStyle = '#5c3621';
      ctx.lineWidth = 9;
      ctx.stroke();

      ctx.strokeStyle = 'rgba(30, 15, 8, 0.6)';
      ctx.lineWidth = 1.5;
      for (const yy of [770, 795]) {
        ctx.beginPath();
        ctx.moveTo(SLING.x - 10, yy);
        ctx.quadraticCurveTo(SLING.x, yy + 4, SLING.x + 11, yy);
        ctx.stroke();
      }
      ctx.fillStyle = '#3f7a62';
      ctx.beginPath();
      ctx.ellipse(SLING.x + 1, GROUND - 2, 26, 7, 0, Math.PI, 0);
      ctx.fill();
      wrap(SLING.back.x, SLING.back.y + 6);
    }

    function drawSlingFront() {
      ctx.lineCap = 'round';
      ctx.strokeStyle = '#4a2b1c';
      ctx.lineWidth = 16;
      ctx.beginPath();
      ctx.moveTo(SLING.x + 1, 728);
      ctx.quadraticCurveTo(SLING.x + 28, 702, SLING.front.x, SLING.front.y);
      ctx.stroke();
      ctx.strokeStyle = '#8a5633';
      ctx.lineWidth = 10;
      ctx.stroke();
      ctx.strokeStyle = 'rgba(255, 210, 160, 0.25)';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(SLING.x + 4, 724);
      ctx.quadraticCurveTo(SLING.x + 26, 700, SLING.front.x - 2, SLING.front.y + 2);
      ctx.stroke();
      wrap(SLING.front.x, SLING.front.y + 6);
    }

    function wrap(x, y) {
      ctx.fillStyle = '#c94f3d';
      roundRect(ctx, x - 9, y - 6, 18, 12, 3);
      ctx.fill();
      ctx.strokeStyle = 'rgba(80, 20, 15, 0.6)';
      ctx.lineWidth = 1.2;
      for (let i = -4; i <= 4; i += 4) {
        ctx.beginPath();
        ctx.moveTo(x - 9, y + i);
        ctx.lineTo(x + 9, y + i - 2);
        ctx.stroke();
      }
    }

    function bandStyle(stretch) {
      const r = Math.round(200 + 55 * stretch), g = Math.round(80 + 70 * stretch), b = Math.round(60 + 30 * stretch);
      return { color: `rgb(${r},${g},${b})`, width: 8 - stretch * 3.5 };
    }

    function drawBand(layer, ballPos) {
      const tip = layer === 'back' ? SLING.back : SLING.front;
      ctx.lineCap = 'round';
      if (ballPos) {
        const r = AMMO[selected].r;
        const stretch = Math.min(1, Math.hypot(pull.x, pull.y) / MAX_PULL);
        const st = bandStyle(stretch);
        const dir = Vector.normalise({ x: ballPos.x - SLING.anchor.x || 0.001, y: ballPos.y - SLING.anchor.y });
        const hold = { x: ballPos.x + dir.x * r * 0.7, y: ballPos.y + dir.y * r * 0.7 };
        ctx.strokeStyle = 'rgba(60, 15, 10, 0.5)';
        ctx.lineWidth = st.width + 3;
        ctx.beginPath();
        ctx.moveTo(tip.x, tip.y + 4);
        ctx.lineTo(hold.x, hold.y);
        ctx.stroke();
        ctx.strokeStyle = st.color;
        ctx.lineWidth = st.width;
        ctx.stroke();
        if (layer === 'back') {
          const a = Math.atan2(dir.y, dir.x);
          ctx.strokeStyle = '#4a2a1c';
          ctx.lineWidth = 9;
          ctx.beginPath();
          ctx.arc(ballPos.x, ballPos.y, r + 2, a - 1.1, a + 1.1);
          ctx.stroke();
          ctx.strokeStyle = '#7a4a30';
          ctx.lineWidth = 4;
          ctx.stroke();
        }
      } else if (layer === 'back') {
        const midX = (SLING.back.x + SLING.front.x) / 2 + Math.sin(simTime * 0.05) * 18 * bandSnap;
        const midY = SLING.anchor.y + 6 + Math.cos(simTime * 0.06) * 10 * bandSnap;
        const st = bandStyle(0);
        ctx.strokeStyle = st.color;
        ctx.lineWidth = st.width - 1;
        ctx.beginPath();
        ctx.moveTo(SLING.back.x, SLING.back.y + 4);
        ctx.quadraticCurveTo(midX, midY + 8, SLING.front.x, SLING.front.y + 4);
        ctx.stroke();
        ctx.strokeStyle = '#5a3422';
        ctx.lineWidth = 7;
        ctx.beginPath();
        ctx.moveTo(midX - 10, midY + 4);
        ctx.lineTo(midX + 10, midY + 4);
        ctx.stroke();
      }
    }

    function drawTrajectory() {
      const pos = ballRestPos();
      const power = AMMO[selected].power;
      let x = pos.x, y = pos.y, vx = pull.x * power, vy = pull.y * power;
      const stretch = Math.hypot(pull.x, pull.y) / MAX_PULL;
      if (stretch < 0.1) return;
      const col = AMMO[selected].trail;
      ctx.globalCompositeOperation = 'lighter';
      for (let i = 1; i <= 48; i++) {
        vy += GRAV_STEP;
        x += vx;
        y += vy;
        if (y > GROUND) break;
        if (i % 3 !== 0) continue;
        const k = 1 - i / 48;
        ctx.fillStyle = rgba(col, 0.8 * k);
        ctx.beginPath();
        ctx.arc(x, y, 1.5 + 3 * k, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.globalCompositeOperation = 'source-over';

      ctx.font = '600 18px Fredoka, system-ui, sans-serif';
      ctx.textAlign = 'center';
      ctx.fillStyle = 'rgba(255, 244, 226, 0.85)';
      const r = AMMO[selected].r;
      ctx.fillText(Math.round(stretch * 100) + '%', pos.x, pos.y + r + 26 > GROUND ? pos.y - r - 14 : pos.y + r + 26);
    }

    function drawParticles() {
      for (const p of particles) {
        const k = p.life / p.max;
        if (p.kind === 'chip') {
          ctx.save();
          ctx.translate(p.x, p.y);
          ctx.rotate(p.rot);
          ctx.fillStyle = rgba(p.color, Math.min(1, (1 - k) * 2));
          ctx.fillRect(-p.size, -p.size / 2, p.size * 2, p.size);
          ctx.restore();
        } else if (p.kind === 'shard') {
          ctx.save();
          ctx.translate(p.x, p.y);
          ctx.rotate(p.rot);
          ctx.fillStyle = rgba(p.color, 0.55 * Math.min(1, (1 - k) * 2));
          ctx.strokeStyle = `rgba(255, 255, 255, ${0.8 * (1 - k)})`;
          ctx.lineWidth = 1;
          ctx.beginPath();
          ctx.moveTo(0, -p.size);
          ctx.lineTo(p.size * 0.7, p.size * 0.6);
          ctx.lineTo(-p.size * 0.5, p.size * 0.4);
          ctx.closePath();
          ctx.fill();
          ctx.stroke();
          ctx.restore();
        } else if (p.kind === 'smoke') {
          ctx.fillStyle = rgba(p.color, 0.25 * (1 - k));
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.size * (0.6 + k), 0, Math.PI * 2);
          ctx.fill();
        } else if (p.kind === 'confetti') {
          ctx.save();
          ctx.translate(p.x, p.y);
          ctx.rotate(p.rot);
          ctx.scale(1, Math.cos(p.flip));
          ctx.fillStyle = rgba(p.color, Math.min(1, (1 - k) * 3));
          ctx.fillRect(-p.size / 2, -p.size / 4, p.size, p.size / 2);
          ctx.restore();
        } else if (p.kind === 'ghost') {
          ctx.globalAlpha = 0.5 * (1 - k);
          ctx.fillStyle = rgba(p.color, 1);
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.size * 0.8, Math.PI, 0);
          for (let i = 0; i <= 4; i++) {
            const wx = p.x + p.size * 0.8 - (i / 4) * p.size * 1.6;
            ctx.lineTo(wx, p.y + p.size * 0.6 + (i % 2 ? -5 : 3) + Math.sin(p.life * 0.3) * 2);
          }
          ctx.closePath();
          ctx.fill();
          ctx.fillStyle = 'rgba(40, 20, 30, 0.8)';
          for (const sd of [-1, 1]) {
            ctx.beginPath();
            ctx.arc(p.x + sd * p.size * 0.28, p.y - 2, 2.5, 0, Math.PI * 2);
            ctx.fill();
          }
          ctx.globalAlpha = 1;
        }
      }
      ctx.globalCompositeOperation = 'lighter';
      for (const p of particles) {
        const k = p.life / p.max;
        if (p.kind === 'glow') {
          const s = p.size * (1 - k * 0.6);
          const g = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, s * 2);
          g.addColorStop(0, rgba(p.color, 0.9 * (1 - k)));
          g.addColorStop(1, rgba(p.color, 0));
          ctx.fillStyle = g;
          ctx.fillRect(p.x - s * 2, p.y - s * 2, s * 4, s * 4);
        } else if (p.kind === 'ring') {
          ctx.strokeStyle = rgba(p.color, 0.8 * (1 - k));
          ctx.lineWidth = 6 * (1 - k) + 1;
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.size + k * (p.grow || 120), 0, Math.PI * 2);
          ctx.stroke();
        } else if (p.kind === 'flash') {
          const g = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.size);
          g.addColorStop(0, rgba(p.color, 0.6 * (1 - k)));
          g.addColorStop(1, rgba(p.color, 0));
          ctx.fillStyle = g;
          ctx.fillRect(p.x - p.size, p.y - p.size, p.size * 2, p.size * 2);
        }
      }
      ctx.globalCompositeOperation = 'source-over';

      ctx.font = '700 24px Fredoka, system-ui, sans-serif';
      ctx.textAlign = 'center';
      ctx.lineJoin = 'round';
      for (const p of particles) {
        if (p.kind !== 'text') continue;
        const k = p.life / p.max;
        const a = k < 0.7 ? 1 : 1 - (k - 0.7) / 0.3;
        const sc = Math.min(1, p.life / 6) * (1 + 0.15 * (1 - Math.min(1, p.life / 10)));
        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.scale(sc, sc);
        ctx.lineWidth = 5;
        ctx.strokeStyle = `rgba(30, 16, 50, ${0.8 * a})`;
        ctx.strokeText(p.text, 0, 0);
        ctx.fillStyle = rgba(p.color, a);
        ctx.fillText(p.text, 0, 0);
        ctx.restore();
      }
    }

    function render(time) {
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.drawImage(bg, 0, 0);

      const sx = (Math.random() - 0.5) * shake, sy = (Math.random() - 0.5) * shake;
      ctx.setTransform(dpr * scale, 0, 0, dpr * scale, dpr * (ox + sx * scale), dpr * (oy + sy * scale));

      drawFireflies(time);
      drawShadows();
      drawSlingBack();

      const loaded = (state === 'ready' || state === 'aiming') && ammoLeft() > 0;
      let restPos = null;
      if (loaded) {
        restPos = ballRestPos();
        const e = 1 - Math.pow(1 - loadAnim, 3);
        restPos = { x: restPos.x, y: restPos.y + (1 - e) * 80 };
      }
      drawBand('back', loaded ? restPos : null);

      for (const b of blocks) if (b.plugin.mat !== 'glass') drawBlock(b);
      for (const e of enemies) drawEnemy(e, time);
      for (const b of blocks) if (b.plugin.mat === 'glass') drawBlock(b);

      if (loaded) {
        const idle = state === 'ready' ? Math.sin(time * 0.004) * 0.25 + 0.75 : 1;
        drawProjectile(selected, restPos.x, restPos.y, 0, Math.min(1, loadAnim * 1.5), idle);
      }
      if (ball) drawProjectile(ball.plugin.type, ball.position.x, ball.position.y, ball.angle);

      drawBand('front', loaded ? restPos : null);
      drawSlingFront();
      drawParticles();
      if (state === 'aiming') drawTrajectory();

      if (loaded && state === 'ready' && loadAnim >= 1 && shotsFired === 0 && level === 0) {
        const k = (time % 1600) / 1600;
        ctx.strokeStyle = `rgba(160, 245, 230, ${0.6 * (1 - k)})`;
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(restPos.x, restPos.y, AMMO[selected].r + 6 + k * 26, 0, Math.PI * 2);
        ctx.stroke();
      }
    }

    // ---------------------------------------------------------------
    // Main loop (fixed physics step)
    // ---------------------------------------------------------------
    let last = performance.now(), acc = 0;
    function frame(now) {
      acc += Math.min(100, now - last);
      last = now;
      let steps = 0;
      while (acc >= STEP && steps < 5) {
        Engine.update(engine, STEP);
        stepGame();
        acc -= STEP;
        steps++;
      }
      if (steps === 5) acc = 0;
      shake *= 0.88;
      if (shake < 0.1) shake = 0;
      shownScore += (score - shownScore) * 0.15;
      if (Math.abs(score - shownScore) < 1) shownScore = score;
      scoreEl.textContent = fmt(shownScore);
      render(now);
      requestAnimationFrame(frame);
    }

    window.addEventListener('resize', resize);
    resize();
    buildLevel(0);
    document.getElementById('levelName').textContent = LEVELS[0].name;
    updateHud();
    renderLevelGrid();
    requestAnimationFrame(frame);
  })();
  </script>
</body>
</html>
